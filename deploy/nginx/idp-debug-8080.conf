# Include once from nginx's http context (Ubuntu sites-enabled is in http).
log_format idp_debug_safe escape=json '$remote_addr [$time_local] $request_method $uri '
                               '$status $body_bytes_sent $request_time $upstream_status';
map $http_upgrade $idp_debug_connection {
    default upgrade;
    '' close;
}

server {
    # Temporary HTTP debugging endpoint; use disposable credentials and data.
    listen 8080;
    server_name 8.148.29.9;
    access_log /var/log/nginx/idp-debug-access.log idp_debug_safe;
    # Nginx error logs cannot redact request query strings. Use sanitized access
    # status/upstream_status and the backend journal for request diagnostics.
    error_log /dev/null;
    client_max_body_size 11m;
    client_body_timeout 30s;

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $idp_debug_connection;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 5s;
    }
}
